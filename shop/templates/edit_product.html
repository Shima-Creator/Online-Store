{% extends "base.html" %}
{% load static %}
{% block title %} <h1>Изменение товара</h1> {% endblock %}

    {% block info %}
        <div>



                <img class="product-photo" src="{{ product.photo.url }}" alt='No photo.'/>
                <h1>{{ product.name }}</h1>
                <p>{{ product.description }}</p>
                <p>Цена: {{ product.price }} руб.</p>
                <p>Категория: {{ product.subcategory.name }}</p>



        </div>

        <div class="seller_product">


                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    {{product_form.as_p}}
                    <p ><button class="add_product_button" type="submit">Сохранить</button></p>

                </form>
            </div>
    {% endblock %}
